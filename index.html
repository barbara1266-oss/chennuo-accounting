<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晨諾創意 內帳系統</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#33312e;--mute:#8d8880;--line:#e9e4db;--gold:#f2b800;--gold2:#ffd34d;--deep:#4a4742;--ok:#3f9b6b;--warn:#c98a00;--r:18px;--sh:0 6px 24px rgba(60,50,30,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* 登入 */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{width:min(420px,100%);background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:36px 32px}
.brand{display:inline-flex;align-items:center;gap:0;font-size:20px;letter-spacing:.04em}
.brand b{background:var(--deep);color:#fff;padding:7px 14px;border-radius:14px 0 0 14px;font-weight:300}
.brand i{background:var(--gold);color:#3a2f00;padding:7px 14px;border-radius:0 14px 14px 0;font-style:normal;font-weight:600}
.lcard h2{margin:22px 0 4px;font-size:20px}.lcard p{margin:0 0 20px;color:var(--mute);font-size:13.5px}
/* 共用元件 */
label.f{display:block;font-size:12.5px;color:var(--mute);margin:0 0 6px 4px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:#fcfbf9;border-radius:14px;padding:11px 14px;outline:none;transition:.15s}
.in:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(242,184,0,.15)}
textarea.in{resize:vertical;min-height:64px;line-height:1.5}
.btn{border:0;border-radius:999px;padding:11px 22px;cursor:pointer;background:#fff;border:1.5px solid var(--line);transition:.15s;font-weight:500;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(60,50,30,.1)}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent;color:#3a2f00;font-weight:700;box-shadow:0 6px 16px rgba(242,184,0,.35)}
.btn.dark{background:var(--deep);color:#fff;border-color:transparent}
.btn.sm{padding:7px 14px;font-size:13px}.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600}
.b-draft{background:#fff4d6;color:var(--warn)}.b-lock{background:#e1f3ea;color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* 版面 */
.top{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1500px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:9px 18px;border-radius:999px;cursor:pointer;color:var(--mute);font-weight:500}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(60,50,30,.08)}
.who{font-size:13px;color:var(--mute);display:flex;gap:12px;align-items:center}
main{max-width:1500px;margin:0 auto;padding:24px}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.bar .in{max-width:320px}.chips{display:flex;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font-size:13px}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
table.ls{width:100%;border-collapse:separate;border-spacing:0 8px}
table.ls th{font-size:12.5px;color:var(--mute);font-weight:500;text-align:left;padding:0 16px 4px}
table.ls td{background:#fff;padding:14px 16px;cursor:pointer}
table.ls td:first-child{border-radius:16px 0 0 16px}table.ls td:last-child{border-radius:0 16px 16px 0}
table.ls tr.row:hover td{background:#fffaf0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:48px;text-align:center;color:var(--mute)}
/* 編輯器 */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:22px;align-items:start}
.sec{margin-bottom:18px}.sec h3{margin:0 0 14px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.line{background:#fcfbf9;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.line .r1{display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:10px;margin-bottom:10px}
.line .r1.m{grid-template-columns:1.3fr 1fr 1fr 1.3fr}
.line .r4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
details.mk{margin-top:14px}details.mk summary{cursor:pointer;color:var(--mute);font-size:14px;padding:6px 0}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#eef2f7;color:#5a6b80;margin-left:6px}
.line .r3{display:grid;grid-template-columns:.7fr .7fr 1fr 1fr 1.2fr auto;gap:10px;align-items:end;margin-top:10px}
.amt{font-weight:700;text-align:right;padding:11px 4px;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:50%;border:0;background:#f1ece3;cursor:pointer}.x:hover{background:#ffe1dc}
.term{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fcfbf9}
.term .th{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:600}
.term input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.tot{display:grid;grid-template-columns:1fr auto;gap:8px 24px;justify-content:end;font-variant-numeric:tabular-nums}
.tot .big{font-size:20px;font-weight:800}
.pvwrap{position:sticky;top:78px}
.pvbox{background:#ddd7cc;border-radius:var(--r);padding:14px;overflow:hidden}
.pvin{background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18);transform-origin:top left;width:794px}
.pvin iframe{width:794px;border:0;display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 22px;border-radius:999px;box-shadow:var(--sh);z-index:99;max-width:90vw}
.toast a{color:var(--gold2)}
.modal{position:fixed;inset:0;background:rgba(40,35,25,.45);display:grid;place-items:center;z-index:60;padding:20px}
.mbox{background:#fff;border-radius:26px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 18px}.mbox .fld{margin-bottom:14px}
.demo{background:#fff4d6;color:var(--warn);text-align:center;font-size:13px;padding:6px}
.b-off{background:#eee;color:var(--mute)}
table.ls.nolink td{cursor:default}table.ls.nolink tr.row:hover td{background:#fff}
.codebox{font-size:34px;letter-spacing:.3em;font-weight:800;text-align:center;background:#fff4d6;border-radius:22px;padding:20px 8px 20px 20px;margin:16px 0;font-variant-numeric:tabular-nums;user-select:all}
/* 第3棒 */
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;background:#eee;color:#8d8880;white-space:nowrap}
.p-ok{background:#e1f3ea;color:#3f9b6b}.p-warn{background:#fff4d6;color:#c98a00}.p-bad{background:#fde4e0;color:#c0392b}.p-mute{background:#eee;color:#8d8880}
.mini{border:1.5px solid var(--line);background:#fcfbf9;border-radius:12px;padding:6px 10px;font-size:13px;outline:none;width:100%}
.mini:focus{border-color:var(--gold);background:#fff}
.invin{display:grid;grid-template-columns:118px 84px 128px 18px;gap:6px;align-items:center}.invin .st{font-size:13px;color:var(--mute)}
.sc{overflow-x:auto}table.ls.wide td{white-space:nowrap}
.line .r4.b3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:1100px){.ed{grid-template-columns:1fr}.pvwrap{position:static}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.line .r1,.line .r1.m,.line .r3,.grid2,.grid3{grid-template-columns:1fr 1fr}main{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ 設定 ============ */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxj7ARkJyKml1cN8h8I6qT5jtokzj75pgZa-q5XFmTHPJRUG-tCxWkoLMkropPorhXDUQ/exec';            // ← 部署 GAS 網頁應用程式後，把網址貼在這裡；留空＝示範模式（資料只存在目前畫面）
var DEMO = !GAS_URL;

/* ===== 報價單範本（梅科版 M / 一般版 G）— 純 table 排版，瀏覽器預覽與 GAS 轉 PDF 共用 ===== */
function renderQuote(q, assets) {
  assets = assets || {};
  var M = (q.ver === 'M');
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function br(s) { return esc(s).replace(/\r?\n/g, '<br>'); }
  function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
  function d(s) { return s ? String(s).replace(/-/g, '/') : ''; }
  var lines = q.lines || [], terms = q.terms || [];
  var taxTxt = (q.invoice === '免開發票' && !Number(q.tax)) ? '免開發票' : money(q.tax);

  var css = '' +
    '@page{size:A4;margin:10mm}' +
    'html,body{margin:0;padding:0;background:#fff}' +
    'body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",Arial,sans-serif;color:#222;font-size:8.5pt;line-height:1.38}' +
    '.pg{width:190mm;margin:0 auto}' +
    'table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:190mm}' +
    'td,th{padding:0;vertical-align:middle;word-wrap:break-word;overflow-wrap:anywhere}' +
    '.top td{height:17mm}' +
    '.ttl{text-align:center;font-size:17pt;letter-spacing:.22em;color:#555;padding-right:6mm}' +
    '.lb{background:#cdcdcd;color:#888;text-align:right;padding:1.2mm 2.4mm;border:.35mm solid #fff;font-size:8.5pt}' +
    '.vl{background:#fff;padding:1.2mm 2.4mm;border-bottom:.25mm solid #d6d6d6;font-size:9pt}.hd .lb{white-space:nowrap}.bk{font-size:9.8pt;line-height:1.45}' +
    '.big{font-size:15.5pt;line-height:1.25}' +
    '.gap{background:#fff}' +
    '.th{color:#8a8a8a;font-size:8.5pt;padding:1.6mm 1mm;border-bottom:.7mm solid #b9b9b9;text-align:center;white-space:nowrap}' +
    '.th.l{text-align:left}.th.r{text-align:right}' +
    '.td{padding:1.6mm 1mm;border-bottom:.25mm solid #e2e2e2;vertical-align:middle;font-size:9pt;line-height:1.42}' +
    '.td.r{text-align:right;white-space:nowrap}.td.c{text-align:center}.td.n{white-space:nowrap}' +
    '.tm{background:#fff;padding:.9mm 2.4mm 1.1mm;font-size:7.4pt;line-height:1.38;border-top:.25mm solid #d6d6d6}' +
    '.gold{white-space:nowrap;background:#ffc800;font-weight:700;font-size:9pt;text-align:right;padding:1.2mm 2.4mm;border:.35mm solid #fff;color:#222}' +
    '.amt{font-size:8.5pt;padding:1.2mm 2.4mm;border-bottom:.25mm solid #d6d6d6}' +
    '.seal{height:30mm;padding:1mm 4mm}.seal img{height:27mm}' +
    '.att{min-height:48mm;height:48mm;background:#fff;border-bottom:.25mm solid #d6d6d6;vertical-align:top;padding:2mm}' +
    '.att img{max-width:100%;max-height:60mm;margin:0 2mm 2mm 0}' +
    'tr{page-break-inside:avoid}.nb{page-break-inside:avoid}';

  /* ---- 欄寬（mm，合計 190） ---- */
  var wM = [30.4, 19, 18, 34, 12, 17.5, 11.5, 23.6, 24.0]; // 內容,商品編號,項目,規格,數量,單價,單位,金額,備註（合計 190）
  var wG = [20.5, 25, 22, 47, 12, 8.2, 19, 21.4, 14.9];     // 編號,項目名稱,產品,內容,數量,單位,單價,金額,備註（合計 190）
  function cg(w) { return '<colgroup>' + w.map(function (x) { return '<col style="width:' + x + 'mm">'; }).join('') + '</colgroup>'; }

  /* ---- Logo 與標題 ---- */
  var logo = assets.logo
    ? '<img src="' + assets.logo + '" style="height:15mm;display:block">'
    : '<div style="display:inline-block;background:#4a4a4a;padding:3mm 4mm;color:#fff;font-size:13pt;letter-spacing:.05em;line-height:1">Sincerity <span style="background:#f2c200;color:#333;padding:1mm 2mm;margin-left:2mm">晨諾創意</span></div>';
  var head = '<table class="top"><colgroup><col style="width:100mm"><col style="width:90mm"></colgroup><tr><td>' + logo + '</td><td class="ttl">報價單' + (q.status === '已作廢' ? '<div style="font-size:11pt;letter-spacing:.1em;color:#c0392b;margin-top:1mm">已作廢</div>' : '') + '</td></tr></table><div style="height:6mm"></div>';

  /* ---- 表頭資料區 ---- */
  var hd;
  if (M) {
    hd = '<table class="hd">' + cg([30, 72, 18, 19, 21, 30]) +
      '<tr><td class="lb">專案名稱</td><td class="vl big">' + br(q.project) + '</td><td class="lb">客戶編號</td><td class="vl">' + esc(q.custNo) + '</td><td class="lb">報價日期</td><td class="vl">' + d(q.date) + '</td></tr>' +
      '<tr><td class="lb">公司</td><td class="vl">' + esc(q.company) + '</td><td class="lb">統編</td><td class="vl">' + esc(q.taxId) + '</td><td class="lb">報價單編號</td><td class="vl">' + esc(q.no) + '</td></tr>' +
      '<tr><td class="lb">聯絡人</td><td class="vl">' + esc(q.contact) + '</td><td class="lb">E-mail</td><td class="vl" colspan="3" style="color:#2a6fc9">' + esc(q.email) + '</td></tr>' +
      '<tr><td class="lb">電話</td><td class="vl" style="color:#2a6fc9">' + esc(q.phone) + '</td><td class="lb">地址</td><td class="vl" colspan="3" style="color:#2a6fc9">' + esc(q.address) + '</td></tr></table>';
  } else {
    hd = '<table class="hd">' + cg([20.5, 88, 11, 25, 45.5]) +
      '<tr><td class="lb">專案名稱</td><td class="vl big">' + br(q.project) + '</td><td class="gap"></td><td class="lb">報價日期</td><td class="vl">' + d(q.date) + '</td></tr>' +
      '<tr><td class="lb">公司</td><td class="vl">' + esc(q.company) + '</td><td class="gap"></td><td class="lb">報價單編號</td><td class="vl">' + esc(q.no) + '</td></tr>' +
      '<tr><td class="lb">電話</td><td class="vl" style="color:#2a6fc9">' + esc(q.phone) + '</td><td class="gap"></td><td class="lb">客戶編號</td><td class="vl">' + esc(q.custNo) + '</td></tr>' +
      '<tr><td class="lb">地址</td><td class="vl" style="color:#2a6fc9">' + esc(q.address) + '</td><td class="gap"></td><td class="lb">聯絡人</td><td class="vl">' + esc(q.contact) + '</td></tr>' +
      '<tr><td class="lb">E-mail</td><td class="vl" style="color:#2a6fc9">' + esc(q.email) + '</td><td class="gap"></td><td class="lb">統編</td><td class="vl">' + esc(q.taxId) + '</td></tr></table>';
  }

  /* ---- 明細表 ---- */
  var items = '<div style="height:7mm"></div><table>';
  var i, L, rows = '';
  if (M) {
    items += cg(wM) + '<tr><th class="th l">內容</th><th class="th l">商品編號</th><th class="th">項目</th><th class="th l">規格</th><th class="th r">數量</th><th class="th r">單價</th><th class="th">單位</th><th class="th r">金額</th><th class="th l" style="color:#222;font-weight:700">備註</th></tr>';
    var lastGroup = null;
    for (i = 0; i < lines.length; i++) {
      L = lines[i];
      var showG = L.group && L.group !== lastGroup; if (L.group) lastGroup = L.group;
      var spec = (L.item ? esc(L.item) : '') + (L.item && L.spec ? '<br>' : '') + br(L.spec);
      rows += '<tr class="nb"><td class="td">' + (showG ? br(L.group) : '') + '</td><td class="td">' + esc(L.code) + '</td><td class="td c">' + esc(L.product) + '</td><td class="td">' + spec + '</td><td class="td r">' + esc(L.qty) + '</td><td class="td r">' + Number(L.price || 0).toFixed(2) + '</td><td class="td c n">' + esc(L.unit) + '</td><td class="td r">' + money(L.amount) + '</td><td class="td">' + br(L.note) + '</td></tr>';
    }
  } else {
    items += cg(wG) + '<tr><th class="th l">編號</th><th class="th l">項目名稱</th><th class="th l">產品</th><th class="th l">內容</th><th class="th r">數量</th><th class="th">單位</th><th class="th r">單價</th><th class="th r">金額</th><th class="th l">備註</th></tr>';
    for (i = 0; i < lines.length; i++) {
      L = lines[i];
      rows += '<tr class="nb"><td class="td">' + esc(L.code) + '</td><td class="td">' + esc(L.item) + '</td><td class="td">' + esc(L.product) + '</td><td class="td">' + br(L.spec) + '</td><td class="td r">' + esc(L.qty) + '</td><td class="td c n">' + esc(L.unit) + '</td><td class="td r">' + Number(L.price || 0).toFixed(2) + '</td><td class="td r">' + money(L.amount) + '</td><td class="td">' + br(L.note) + '</td></tr>';
    }
  }
  items += rows + '</table>';

  /* ---- 匯款 / 合計 / 條款 / 簽核 / 附件 ---- */
  var bank = br(q.bank);
  var low = '<div style="height:1mm"></div><table>';
  var sealImg = (q.signed && assets.seal) ? '<img src="' + assets.seal + '">' : '';
  var sealDate = q.signed ? d(q.agencyDate || q.date) : '';
  var att = '';
  if (q.attachments && q.attachments.length) { for (i = 0; i < q.attachments.length; i++) att += '<img src="' + q.attachments[i] + '">'; }

  if (M) {
    low += cg([32.4, 94, 24, 39.6]) +
      '<tr><td class="lb" style="font-weight:700">匯款資訊</td><td class="vl bk" style="border:.25mm solid #d6d6d6">' + bank + '</td><td class="lb">小計</td><td class="amt">' + money(q.subtotal) + '</td></tr>' +
      '<tr><td colspan="2"></td><td class="lb">營業稅</td><td class="amt">' + taxTxt + '</td></tr>' +
      '<tr><td colspan="2"></td><td class="gold">總金額(含稅)</td><td class="amt" style="font-size:9pt">' + money(q.total) + '</td></tr>' +
      '<tr><td colspan="4" style="height:5mm"></td></tr>';
    for (i = 0; i < terms.length; i++) {
      low += '<tr class="nb"><td class="lb">' + esc(terms[i].title) + '</td><td class="tm" colspan="3">' + br(terms[i].body) + '</td></tr>';
    }
    low += '<tr class="nb"><td class="lb">Agency Approved by</td><td class="seal" style="background:#fff">' + sealImg + '</td><td class="lb">日期</td><td class="vl" style="border-bottom:.25mm solid #d6d6d6">' + sealDate + '</td></tr>' +
      '<tr class="nb"><td class="lb" style="height:9mm">Client Approved by</td><td class="vl"></td><td class="lb">日期</td><td class="vl"></td></tr>' +
      '<tr><td colspan="4" style="height:5mm"></td></tr>' +
      '<tr class="nb"><td class="lb" style="vertical-align:top">附件參考</td><td class="att" colspan="3">' + att + '</td></tr>';
  } else {
    low += cg([20.5, 88, 11, 25, 45.5]) +
      '<tr><td class="lb" style="font-weight:700">匯款資訊</td><td class="vl bk" style="border:.25mm solid #d6d6d6">' + bank + '</td><td class="gap"></td><td class="lb">小計</td><td class="amt">' + money(q.subtotal) + '</td></tr>';
    var n = Math.max(terms.length, 2);
    for (i = 0; i < n; i++) {
      var T = terms[i] || { title: '', body: '' };
      var right = '<td class="gap"></td><td class="gap" colspan="2"></td>';
      if (i === 0) right = '<td class="gap"></td><td class="lb">營業稅</td><td class="amt">' + taxTxt + '</td>';
      if (i === 1) right = '<td class="gap"></td><td class="gold">總金額(含稅)</td><td class="amt" style="font-size:9pt">' + money(q.total) + '</td>';
      low += '<tr class="nb"><td class="lb">' + esc(T.title) + '</td><td class="tm">' + br(T.body) + '</td>' + right + '</tr>';
    }
    low += '<tr class="nb"><td class="lb">Agency Approved by</td><td class="seal" style="background:#fff">' + sealImg + '</td><td class="gap"></td><td class="lb">日期</td><td class="vl" style="border-bottom:.25mm solid #d6d6d6">' + sealDate + '</td></tr>' +

var LFQ = {};
function lfChange(t) {
  var tr = t.closest('tr'), no = tr && tr.dataset.no, r = rowBy(no), f = t.dataset.lf; if (!r) return;
  var box = t.closest('.invin');

  }
  if (f === 'resolve') {

    if (!confirm('定案為「' + t.value + '」後，這張單的發票狀態就確定了，確定嗎？')) { t.value = ''; return; }

function packCheck() {

  api('packPlan', { cust: S.kc, ym: S.kmo }).then(function (r) {
    var el = $('#packres'); if (!r.ok) return toast(esc(r.msg), 4200); S.pk = r;
    el.innerHTML = '<div class="card" style="margin-bottom:14px">共 <b>' + r.quoteCount + '</b> 張報價單，<b>' + r.branches.length + '</b> 家分院有明細。小計 ' + money(r.totals.sub) + '　營業稅 ' + money(r.totals.tax) + '　總額 <b>' + money(r.totals.total) + '</b>' +
      (r.taxDiff ? '<div style="margin-top:8px;color:var(--warn)">各分院稅額分別四捨五入，加總與整批發票稅額差 ' + r.taxDiff + ' 元（彙整表會註明）。</div>' : '') +
      (r.unassigned.count ? '<div style="margin-top:8px;color:#c0392b">有 ' + r.unassigned.count + ' 列明細（小計 ' + money(r.unassigned.sub) + '）還沒標分院：' + esc(r.unassigned.nos.join('、')) + '。請先到各報價單補標，否則不會列入請款包。</div>' : '') +
      (r.branches.some(function (b) { return !b.last5; }) ? '<div style="margin-top:8px;color:var(--warn)">有分院缺「帳號末五碼」：' + esc(r.branches.filter(function (b) { return !b.last5; }).map(function (b) { return b.name; }).join('、')) + '。請款單上該欄會空白，請先到梅科表補上並同步。</div>' : '') +
      (r.creditUnallocated ? '<div style="margin-top:8px;color:var(--warn)">本月有折讓／讓價 ' + money(r.creditUnallocated) + '，不會分攤到分院，只在彙整表註明。</div>' : '') + '</div>' +
      (r.branches.length ? '<div class="sc"><table class="ls nolink"><tr><th>#</th><th>分院</th><th>公司名稱</th><th>統編</th><th>末五碼</th><th class="num">小計</th><th class="num">稅</th><th class="num">總額</th><th id="pkst"></th></tr>' + r.branches.map(function (b, i) { return '<tr class="row"><td>' + (i + 1) + '</td><td>' + esc(b.name) + '</td><td>' + esc(b.company) + '</td><td>' + esc(b.taxId) + '</td><td>' + (b.last5 ? esc(b.last5) : '<span style="color:#c0392b">缺</span>') + '</td><td class="num">' + money(b.sub) + '</td><td class="num">' + money(b.tax) + '</td><td class="num">' + money(b.total) + '</td><td data-pk="' + esc(b.code) + '"></td></tr>'; }).join('') + '</table></div><div style="margin-top:14px;display:flex;gap:14px;align-items:center"><button class="btn pri" data-act="packrun">產生梅科請款包（' + r.branches.length + ' 份＋彙整表）</button><span id="pkprog" style="color:var(--mute)"></span></div><div id="pkdone"></div>' : '');
  });
}

/* ---- 梅科分院表同步 ---- */
function syncBanner() {
  if (DEMO || !S.user || S.user.role !== '老闆') return '';
  var y = S.sync, box = 'margin:0 0 14px;padding:12px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;';
  if (!y) return '<div style="' + box + 'background:#f3efe6;color:var(--mute)">檢查梅科分院表中…</div>';
  if (y.state === 'ok') return '<div style="' + box + 'background:#e6f4ea;color:#1e6b3a">✓ 與梅科分院表一致' + (y.warns ? '（有 ' + y.warns + ' 則資料提醒）' : '') + '<span style="flex:1"></span><button class="btn sm" data-act="synopen">檢視</button><button class="btn sm ghost" data-act="synrecheck">重新檢查</button></div>';
  if (y.state === 'pending') return '<div style="' + box + 'background:#fff4d6;color:#8a5a00">⚠ 梅科分院表有 ' + y.pending + ' 家分院和我們的清單不同<span style="flex:1"></span><button class="btn sm pri" data-act="synopen">檢視並同步</button></div>';
  return '<div style="' + box + 'background:#fde8e6;color:#a8281c">✗ 目前讀不到梅科分院表：' + esc(y.msg) + '<br>現有分院清單仍可正常使用，只是不會自動更新。<span style="flex:1"></span><button class="btn sm" data-act="synrecheck">重新檢查</button></div>';
}
function syncPaint() { var el = $('#synbox'); if (el) el.innerHTML = syncBanner(); }
function syncLoad(force) {
  if (DEMO || !S.user || S.user.role !== '老闆') return;
  if (S.sync && !force) return;
  api('syncCheck', { force: force ? 1 : 0 }).then(function (r) { S.sync = r && r.ok ? r : { state: 'error', msg: (r && r.msg) || '連線失敗' }; syncPaint(); });
}
function syncModal() {
  var p = S.sp, old = $('#md'); if (old) old.remove();
  var nw = p.items.filter(function (i) { return i.type === '新增'; }), ch = p.items.filter(function (i) { return i.type === '變更'; });
  function row(i) { return '<label style="display:block;padding:8px 0;border-bottom:1px solid #eee"><input type="checkbox" data-sk="' + esc(i.no) + '" checked> <b>' + esc(i.name) + '</b> <span style="color:var(--mute);font-size:12px">店點 ' + esc(i.no) + (i.type === '變更' ? '・' + esc(i.code) : '') + '</span>' +
    (i.changes.length ? '<div style="margin:4px 0 0 24px;font-size:13px;color:#555">' + i.changes.map(function (c) { return esc(c.f) + '：' + (esc(c.from) || '（空）') + ' → <b>' + (esc(c.to) || '（空）') + '</b>'; }).join('<br>') + '</div>' : '<div style="margin:4px 0 0 24px;font-size:13px;color:#555">' + esc(i.title) + '</div>') + '</label>'; }
  var h = '<div class="modal" id="md"><div class="mbox"><h3>梅科分院表同步</h3><div style="color:var(--mute);font-size:13px;margin:-8px 0 12px">來源：' + esc(p.bookName || '梅科分院資訊表') + '（讀到 ' + p.rowsRead + ' 列，' + p.same + ' 家已一致）。取消勾選的項目這次不會動。</div>' +
    (nw.length ? '<h4 style="margin:10px 0 2px">新增 ' + nw.length + ' 家</h4>' + nw.map(row).join('') : '') +
    (ch.length ? '<h4 style="margin:14px 0 2px">變更 ' + ch.length + ' 家</h4>' + ch.map(row).join('') : '') +
    (p.items.length ? '' : '<div class="card empty">沒有需要同步的項目</div>') +
    (p.warns.length ? '<h4 style="margin:14px 0 2px;color:#8a5a00">資料提醒（需跟梅科確認，不影響同步）</h4><div style="font-size:13px;color:#8a5a00">' + p.warns.map(function (w) { return '・' + esc(w.name) + '：' + esc(w.text); }).join('<br>') + '</div>' : '') +
    (p.idle.length ? '<h4 style="margin:14px 0 2px;color:var(--mute)">未啟用／未對上（不會被動到）</h4><div style="font-size:13px;color:var(--mute)">' + p.idle.map(function (w) { return '・' + esc(w.name) + '（' + esc(w.why) + '）'; }).join('<br>') + '</div>' : '') +
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><button class="btn" data-act="mclose">關閉</button>' + (p.items.length ? '<button class="btn pri" data-act="syngo">同步勾選項目</button>' : '') + '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}
function syncOpen() {
  var b = $('[data-act=synopen]'); if (b) b.disabled = true;
  api('syncPlan', {}).then(function (r) {
    if (b) b.disabled = false;
    if (!r || !r.ok) { S.sync = { state: 'error', msg: (r && r.msg) || '連線失敗' }; syncPaint(); return toast(esc(S.sync.msg), 4200); }
    S.sp = r; syncModal();
  });
}
function syncGo() {
  var nos = [].slice.call(document.querySelectorAll('#md [data-sk]')).filter(function (x) { return x.checked; }).map(function (x) { return x.dataset.sk; });
  if (!nos.length) return toast('請至少勾選一項');
  var btn = $('[data-act=syngo]'); btn.disabled = true; btn.textContent = '同步中…';
  api('syncApply', { sig: S.sp.sig, nos: nos }).then(function (r) {
    if (r && r.ok) { S.branches = r.rows; S.sync = null; $('#md').remove(); toast('已同步：新增 ' + r.added + '、變更 ' + r.changed); render(); return; }
    btn.disabled = false; btn.textContent = '同步勾選項目';
    if (r && r.code === 'STALE') { toast(esc(r.msg), 4200); $('#md').remove(); syncOpen(); return; }
    toast(esc((r && r.msg) || '同步失敗'), 4200);
  });
}
function packRun() {
  var r = S.pk, btn = $('[data-act=packrun]'), prog = $('#pkprog'), codes = r.branches.map(function (b) { return b.code; }), done = 0, fails = [], folder = '';
  btn.disabled = true; prog.textContent = '開始產生…';
  function mark(code, txt) { var td = document.querySelector('[data-pk="' + code + '"]'); if (td) td.innerHTML = txt; }
  function chunk(i) {
    if (i >= codes.length) return Promise.resolve();
    return Promise.all(codes.slice(i, i + 4).map(function (code) {
      mark(code, '…');
      return api('packBranch', { cust: r.cust, ym: r.ym, code: code }).then(function (x) {
        if (x && x.ok) { done++; folder = x.folder || folder; mark(code, '<a href="' + esc(x.url) + '" target="_blank">✓ ' + (x.skipped ? '已有' : '完成') + '</a>'); } else { fails.push(code); mark(code, '<span style="color:#c0392b" title="' + esc((x && x.msg) || '') + '">✗ 失敗</span>'); }
        prog.textContent = '已完成 ' + done + ' / ' + codes.length;
      });
    })).then(function () { return chunk(i + 4); });
  }
  chunk(0).then(function () {
    if (fails.length) { btn.disabled = false; prog.textContent = '有 ' + fails.length + ' 份失敗，請再按一次（已完成的會自動略過）'; return; }
    prog.textContent = '產生彙整表…';
    return api('packSummary', { cust: r.cust, ym: r.ym }).then(function (s) {
      btn.disabled = false;
      if (!s || !s.ok) { prog.textContent = '彙整表失敗，請再按一次'; return toast(esc((s && s.msg) || '彙整表失敗'), 4200); }
      prog.textContent = '全部完成'; $('#pkdone').innerHTML = '<div class="card" style="margin-top:14px">已存到雲端硬碟資料夾　<a href="' + esc(s.folder) + '" target="_blank">開啟資料夾</a>　　<a href="' + esc(s.url) + '" target="_blank">開啟彙整表</a></div>';
    });
  });
}

/* ---- 事件（第 3 棒） ---- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return; var a = t.dataset.act;
  if (a === 'mode') { S.mode = t.dataset.v; try { localStorage.setItem('cn_mode', S.mode); } catch (x) {} renderQuotes(); }
  else if (a === 'rowpdf') rowPdf(t.dataset.no, t);
  else if (a === 'paynew') openPayModal('營業'); else if (a === 'gennew') openPayModal('代收代付'); else if (a === 'paysave') paySave(t.dataset.n);
  else if (a === 'crnew') openCreditModal(); else if (a === 'crsave') creditSave();
  else if (a === 'payrev') payRev(t.dataset.id); else if (a === 'crvoid') crVoid(t.dataset.id);
  else if (a === 'brsave') brSave();
  else if (a === 'blprev') blPreview(); else if (a === 'blapply') blApply(); else if (a === 'blundo') blUndo();
  else if (a === 'packcheck') packCheck(); else if (a === 'packrun') packRun();
  else if (a === 'synopen') syncOpen(); else if (a === 'syngo') syncGo(); else if (a === 'synrecheck') { S.sync = null; syncPaint(); syncLoad(true); }
});
document.addEventListener('change', function (e) {
  var t = e.target; if (!t || !t.dataset) return;
  if (t.dataset.lf) lfChange(t);
  else if (t.id === 'pc') { S.pc = t.value; loadPays(); } else if (t.id === 'pm') { S.pm = t.value; loadPays(); }
  else if (t.id === 'dm') { S.dm = t.value; renderDone(); }
  else if (t.id === 'f_designer' && E) api('saveDesigner', { no: E.no, designer: t.value }).then(function (r) { if (!r.ok) return toast(esc(r.msg), 4200); E.designer = r.row['設計師'] || ''; setRow(r.row); toast('設計師已儲存'); });
  else if (t.dataset.dz) api('saveDesigner', { no: t.dataset.dz, designer: t.value }).then(function (r) { if (!r.ok) return toast(esc(r.msg), 4200); setRow(r.row); toast('已儲存'); });
  else if (t.dataset.bk !== undefined) blSyncSum();
  else if (t.id === 'f_allbranch2' && E) { document.querySelectorAll('[data-bi]').forEach(function (s) { s.value = t.value; }); }
  else if (t.id === 'f_allbranch' && E) { E.lines.forEach(function (l) { l.branch = t.value; }); renderLines(); refresh(); }
});
document.addEventListener('input', function (e) { if (e.target.id === 'bl_total') e.target.dataset.touched = 1; });

/* ============ 事件 ============ */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return; var a = t.dataset.act;
  if (a === 'login') doLogin(); else if (a === 'logout') logout();
  else if (a === 'tab') { S.view = t.dataset.v; E = null; S.mq = ''; S.mcat = ''; render(); }
  else if (a === 'mcat') { S.mcat = t.dataset.v === '全部' ? '' : t.dataset.v; renderMaster(t.dataset.t); }
  else if (a === 'savenote') saveNote();
  else if (a === 'filter') { S.filter = t.dataset.v; renderQuotes(); }
  else if (a === 'newq') newQuote(); else if (a === 'open') openQuote(t.dataset.no);
  else if (a === 'copyq') { e.stopPropagation(); copyQuote(t.dataset.no); }
  else if (a === 'back') { E = null; render(); }
  else if (a === 'addline') { E.lines.push(blankLine()); renderLines(); refresh(); }
  else if (a === 'delline') { E.lines.splice(+t.dataset.i, 1); renderLines(); refresh(); }
  else if (a === 'copyprev') copyPrev();
  else if (a === 'copycur') { var q = JSON.parse(JSON.stringify(E)); newQuote(q); toast('已複製為新報價，請確認內容'); }
  else if (a === 'reloadterms') { if (!E.kind) return toast('請先選擇案型'); loadTerms(E.kind); renderTerms(); refresh(); }
  else if (a === 'save') saveQ();
  else if (a === 'lock') { if (!confirm('送出後內容會鎖定，確定嗎？')) return; saveQ(function () { api('lockQuote', { no: E.no, version: E.version }).then(function (r) { if (!r.ok) return toast(esc(r.msg)); E = r.quote; E.terms = (E.terms || []).map(function (x) { x.on = true; return x; }); E.bank = S.settings.bank; api('boot').then(function (b) { if (b.ok) S.quotes = b.quotes; }); renderEditor(); if (DEMO) toast('已鎖定（示範模式請用「列印／另存 PDF」）'); else doPdf(); }); }); }
  else if (a === 'pdf') doPdf();
  else if (a === 'void') openVoid(); else if (a === 'vsave') vsave();
  else if (a === 'print') { var f = $('#pv'); f.contentWindow.focus(); f.contentWindow.print(); }
  else if (a === 'mnew') openModal(t.dataset.t); else if (a === 'medit') openModal(t.dataset.t, S[t.dataset.t][+t.dataset.i]);
  else if (a === 'mclose') $('#md').remove(); else if (a === 'msave') msave(t.dataset.t); else if (a === 'mdel') mdel(t.dataset.t);
  else if (a === 'unew') openUserModal(); else if (a === 'usave') usave(); else if (a === 'ucopy') ucopy(t.dataset.txt);
  else if (a === 'ureset') ureset(+t.dataset.i); else if (a === 'utoggle') utoggle(+t.dataset.i);
});
document.addEventListener('input', function (e) {
  var t = e.target; if (!E || RENDERING) return;
  if (t.dataset.k) { E[t.dataset.k] = t.value; debounce(refresh, 150); }
  else if (t.dataset.lk) { var l = E.lines[+t.dataset.li]; l[t.dataset.lk] = (t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value); if (E.status === '草稿') calc(E); var am = $('#am' + t.dataset.li); if (am) am.textContent = money(l.amount); debounce(refresh, 150); }
  else if (t.dataset.tk === 'body') { E.terms[+t.dataset.ti].body = t.value; debounce(refresh, 150); }
});
document.addEventListener('change', function (e) {
  var t = e.target; if (!E || RENDERING) return;
  if (t.id === 'f_cust') { var c = S.customers.filter(function (x) { return x['客戶編號'] === t.value; })[0]; fillCustomer(c); renderEditor(); }
  else if (t.id === 'f_kind') { E.kind = t.value; loadTerms(E.kind); renderTerms(); refresh(); }
  else if (t.dataset.lk === 'code') autofill(+t.dataset.li);
  else if (t.dataset.tk === 'on') { E.terms[+t.dataset.ti].on = t.checked; refresh(); }
});
['render', 'renderEditor', 'renderLines', 'renderTerms', 'renderQuotes', 'renderMaster', 'renderUsers', 'drawUsers', 'renderBilling', 'renderPays', 'renderDone', 'renderPack', 'drawBill'].forEach(function (n) { var f = window[n]; window[n] = function () { RENDERING++; try { return f.apply(this, arguments); } finally { RENDERING--; } }; });
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'lg_code') doLogin(); });
start();
</script>
