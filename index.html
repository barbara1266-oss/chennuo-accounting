<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晨諾創意 內帳系統</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#33312e;--mute:#8d8880;--line:#e9e4db;--gold:#f2b800;--gold2:#ffd34d;--deep:#4a4742;--ok:#3f9b6b;--warn:#c98a00;--r:18px;--sh:0 6px 24px rgba(60,50,30,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* 登入 */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{width:min(420px,100%);background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:36px 32px}
.brand{display:inline-flex;align-items:center;gap:0;font-size:20px;letter-spacing:.04em}
.brand b{background:var(--deep);color:#fff;padding:7px 14px;border-radius:14px 0 0 14px;font-weight:300}
.brand i{background:var(--gold);color:#3a2f00;padding:7px 14px;border-radius:0 14px 14px 0;font-style:normal;font-weight:600}
.lcard h2{margin:22px 0 4px;font-size:20px}.lcard p{margin:0 0 20px;color:var(--mute);font-size:13.5px}
/* 共用元件 */
label.f{display:block;font-size:12.5px;color:var(--mute);margin:0 0 6px 4px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:#fcfbf9;border-radius:14px;padding:11px 14px;outline:none;transition:.15s}
.in:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(242,184,0,.15)}
textarea.in{resize:vertical;min-height:64px;line-height:1.5}
.btn{border:0;border-radius:999px;padding:11px 22px;cursor:pointer;background:#fff;border:1.5px solid var(--line);transition:.15s;font-weight:500;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(60,50,30,.1)}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent;color:#3a2f00;font-weight:700;box-shadow:0 6px 16px rgba(242,184,0,.35)}
.btn.dark{background:var(--deep);color:#fff;border-color:transparent}
.btn.sm{padding:7px 14px;font-size:13px}.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600}
.b-draft{background:#fff4d6;color:var(--warn)}.b-lock{background:#e1f3ea;color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* 版面 */
.top{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1500px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:9px 18px;border-radius:999px;cursor:pointer;color:var(--mute);font-weight:500}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(60,50,30,.08)}
.who{font-size:13px;color:var(--mute);display:flex;gap:12px;align-items:center}
main{max-width:1500px;margin:0 auto;padding:24px}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.bar .in{max-width:320px}.chips{display:flex;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font-size:13px}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
table.ls{width:100%;border-collapse:separate;border-spacing:0 8px}
table.ls th{font-size:12.5px;color:var(--mute);font-weight:500;text-align:left;padding:0 16px 4px}
table.ls td{background:#fff;padding:14px 16px;cursor:pointer}
table.ls td:first-child{border-radius:16px 0 0 16px}table.ls td:last-child{border-radius:0 16px 16px 0}
table.ls tr.row:hover td{background:#fffaf0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:48px;text-align:center;color:var(--mute)}
/* 編輯器 */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:22px;align-items:start}
.sec{margin-bottom:18px}.sec h3{margin:0 0 14px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.line{background:#fcfbf9;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.line .r1{display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:10px;margin-bottom:10px}
.line .r1.m{grid-template-columns:1.3fr 1fr 1fr 1.3fr}
.line .r3{display:grid;grid-template-columns:.7fr .7fr 1fr 1fr 1.2fr auto;gap:10px;align-items:end;margin-top:10px}
.amt{font-weight:700;text-align:right;padding:11px 4px;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:50%;border:0;background:#f1ece3;cursor:pointer}.x:hover{background:#ffe1dc}
.term{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fcfbf9}
.term .th{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:600}
.term input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.tot{display:grid;grid-template-columns:1fr auto;gap:8px 24px;justify-content:end;font-variant-numeric:tabular-nums}
.tot .big{font-size:20px;font-weight:800}
.pvwrap{position:sticky;top:78px}
.pvbox{background:#ddd7cc;border-radius:var(--r);padding:14px;overflow:hidden}
.pvin{background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18);transform-origin:top left;width:794px}
.pvin iframe{width:794px;border:0;display:block}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 22px;border-radius:999px;box-shadow:var(--sh);z-index:99;max-width:90vw}
.toast a{color:var(--gold2)}
.modal{position:fixed;inset:0;background:rgba(40,35,25,.45);display:grid;place-items:center;z-index:60;padding:20px}
.mbox{background:#fff;border-radius:26px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 18px}.mbox .fld{margin-bottom:14px}
.demo{background:#fff4d6;color:var(--warn);text-align:center;font-size:13px;padding:6px}
.b-off{background:#eee;color:var(--mute)}
table.ls.nolink td{cursor:default}table.ls.nolink tr.row:hover td{background:#fff}
.codebox{font-size:40px;letter-spacing:.3em;font-weight:800;text-align:center;background:#fff4d6;border-radius:22px;padding:20px 8px 20px 20px;margin:16px 0;font-variant-numeric:tabular-nums;user-select:all}
@media(max-width:1100px){.ed{grid-template-columns:1fr}.pvwrap{position:static}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.line .r1,.line .r1.m,.line .r3,.grid2,.grid3{grid-template-columns:1fr 1fr}main{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ 設定 ============ */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxj7ARkJyKml1cN8h8I6qT5jtokzj75pgZa-q5XFmTHPJRUG-tCxWkoLMkropPorhXDUQ/exec';            // ← 部署 GAS 網頁應用程式後，把網址貼在這裡；留空＝示範模式（資料只存在目前畫面）
var DEMO = !GAS_URL;

/* ===== 報價單範本（梅科版 M / 一般版 G）— 純 table 排版，瀏覽器預覽與 GAS 轉 PDF 共用 ===== */
function renderQuote(q, assets) {
  assets = assets || {};
  var M = (q.ver === 'M');
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function br(s) { return esc(s).replace(/\r?\n/g, '<br>'); }
  function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
  function d(s) { return s ? String(s).replace(/-/g, '/') : ''; }
  var lines = q.lines || [], terms = q.terms || [];

  var css = '' +
    '@page{size:A4;margin:10mm}' +
    'html,body{margin:0;padding:0;background:#fff}' +
    'body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",Arial,sans-serif;color:#222;font-size:8.5pt;line-height:1.38}' +
    '.pg{width:190mm;margin:0 auto}' +
    'table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:190mm}' +
    'td,th{padding:0;vertical-align:middle;word-wrap:break-word;overflow-wrap:anywhere}' +
    '.top td{height:17mm}' +
    '.ttl{text-align:center;font-size:17pt;letter-spacing:.22em;color:#555;padding-right:6mm}' +
    '.lb{background:#cdcdcd;color:#888;text-align:right;padding:1.2mm 2.4mm;border:.35mm solid #fff;font-size:8.5pt}' +
    '.vl{background:#fff;padding:1.2mm 2.4mm;border-bottom:.25mm solid #d6d6d6;font-size:9pt}.hd .lb{white-space:nowrap}.bk{font-size:9.8pt;line-height:1.45}' +
    '.big{font-size:15.5pt;line-height:1.25}' +
    '.gap{background:#fff}' +
    '.th{color:#8a8a8a;font-size:8.5pt;padding:1.6mm 1mm;border-bottom:.7mm solid #b9b9b9;text-align:center;white-space:nowrap}' +
    '.th.l{text-align:left}.th.r{text-align:right}' +
    '.td{padding:1.6mm 1mm;border-bottom:.25mm solid #e2e2e2;vertical-align:middle;font-size:9pt;line-height:1.42}' +
    '.td.r{text-align:right;white-space:nowrap}.td.c{text-align:center}.td.n{white-space:nowrap}' +
    '.tm{background:#fff;padding:.9mm 2.4mm 1.1mm;font-size:7.4pt;line-height:1.38;border-top:.25mm solid #d6d6d6}' +
    '.gold{white-space:nowrap;background:#ffc800;font-weight:700;font-size:9pt;text-align:right;padding:1.2mm 2.4mm;border:.35mm solid #fff;color:#222}' +
    '.amt{font-size:8.5pt;padding:1.2mm 2.4mm;border-bottom:.25mm solid #d6d6d6}' +
    '.seal{height:30mm;padding:1mm 4mm}.seal img{height:27mm}' +
    '.att{min-height:48mm;height:48mm;background:#fff;border-bottom:.25mm solid #d6d6d6;vertical-align:top;padding:2mm}' +
    '.att img{max-width:100%;max-height:60mm;margin:0 2mm 2mm 0}' +
    'tr{page-break-inside:avoid}.nb{page-break-inside:avoid}';

  /* ---- 欄寬（mm，合計 190） ---- */
  var wM = [30.4, 19, 18, 34, 12, 17.5, 11.5, 23.6, 24.0]; // 內容,商品編號,項目,規格,數量,單價,單位,金額,備註（合計 190）
  var wG = [20.5, 25, 22, 47, 12, 8.2, 19, 21.4, 14.9];     // 編號,項目名稱,產品,內容,數量,單位,單價,金額,備註（合計 190）
  function cg(w) { return '<colgroup>' + w.map(function (x) { return '<col style="width:' + x + 'mm">'; }).join('') + '</colgroup>'; }

  /* ---- Logo 與標題 ---- */
  var logo = assets.logo
    ? '<img src="' + assets.logo + '" style="height:15mm;display:block">'
    : '<div style="display:inline-block;background:#4a4a4a;padding:3mm 4mm;color:#fff;font-size:13pt;letter-spacing:.05em;line-height:1">Sincerity <span style="background:#f2c200;color:#333;padding:1mm 2mm;margin-left:2mm">晨諾創意</span></div>';
  var head = '<table class="top"><colgroup><col style="width:100mm"><col style="width:90mm"></colgroup><tr><td>' + logo + '</td><td class="ttl">報價單</td></tr></table><div style="height:6mm"></div>';

  /* ---- 表頭資料區 ---- */
  var hd;
  if (M) {
    hd = '<table class="hd">' + cg([30, 72, 18, 19, 21, 30]) +
      '<tr><td class="lb">專案名稱</td><td class="vl big">' + br(q.project) + '</td><td class="lb">客戶編號</td><td class="vl">' + esc(q.custNo) + '</td><td class="lb">報價日期</td><td class="vl">' + d(q.date) + '</td></tr>' +
      '<tr><td class="lb">公司</td><td class="vl">' + esc(q.company) + '</td><td class="lb">統編</td><td class="vl">' + esc(q.taxId) + '</td><td class="lb">報價單編號</td><td class="vl">' + esc(q.no) + '</td></tr>' +
      '<tr><td class="lb">聯絡人</td><td class="vl">' + esc(q.contact) + '</td><td class="lb">E-mail</td><td class="vl" colspan="3" style="color:#2a6fc9">' + esc(q.email) + '</td></tr>' +
      '<tr><td class="lb">電話</td><td class="vl" style="color:#2a6fc9">' + esc(q.phone) + '</td><td class="lb">地址</td><td class="vl" colspan="3" style="color:#2a6fc9">' + esc(q.address) + '</td></tr></table>';
  } else {
    hd = '<table class="hd">' + cg([20.5, 88, 11, 25, 45.5]) +
      '<tr><td class="lb">專案名稱</td><td class="vl big">' + br(q.project) + '</td><td class="gap"></td><td class="lb">報價日期</td><td class="vl">' + d(q.date) + '</td></tr>' +
      '<tr><td class="lb">公司</td><td class="vl">' + esc(q.company) + '</td><td class="gap"></td><td class="lb">報價單編號</td><td class="vl">' + esc(q.no) + '</td></tr>' +
      '<tr><td class="lb">電話</td><td class="vl" style="color:#2a6fc9">' + esc(q.phone) + '</td><td class="gap"></td><td class="lb">客戶編號</td><td class="vl">' + esc(q.custNo) + '</td></tr>' +
      '<tr><td class="lb">地址</td><td class="vl" style="color:#2a6fc9">' + esc(q.address) + '</td><td class="gap"></td><td class="lb">聯絡人</td><td class="vl">' + esc(q.contact) + '</td></tr>' +
      '<tr><td class="lb">E-mail</td><td class="vl" style="color:#2a6fc9">' + esc(q.email) + '</td><td class="gap"></td><td class="lb">統編</td><td class="vl">' + esc(q.taxId) + '</td></tr></table>';
  }

  /* ---- 明細表 ---- */
  var items = '<div style="height:7mm"></div><table>';
  var i, L, rows = '';
  if (M) {
    items += cg(wM) + '<tr><th class="th l">內容</th><th class="th l">商品編號</th><th class="th">項目</th><th class="th l">規格</th><th class="th r">數量</th><th class="th r">單價</th><th class="th">單位</th><th class="th r">金額</th><th class="th l" style="color:#222;font-weight:700">備註</th></tr>';
    var lastGroup = null;
    for (i = 0; i < lines.length; i++) {
      L = lines[i];
      var showG = L.group && L.group !== lastGroup; if (L.group) lastGroup = L.group;
      var spec = (L.item ? esc(L.item) : '') + (L.item && L.spec ? '<br>' : '') + br(L.spec);
      rows += '<tr class="nb"><td class="td">' + (showG ? br(L.group) : '') + '</td><td class="td">' + esc(L.code) + '</td><td class="td c">' + esc(L.product) + '</td><td class="td">' + spec + '</td><td class="td r">' + esc(L.qty) + '</td><td class="td r">' + Number(L.price || 0).toFixed(2) + '</td><td class="td c n">' + esc(L.unit) + '</td><td class="td r">' + money(L.amount) + '</td><td class="td">' + br(L.note) + '</td></tr>';
    }
  } else {
    items += cg(wG) + '<tr><th class="th l">編號</th><th class="th l">項目名稱</th><th class="th l">產品</th><th class="th l">內容</th><th class="th r">數量</th><th class="th">單位</th><th class="th r">單價</th><th class="th r">金額</th><th class="th l">備註</th></tr>';
    for (i = 0; i < lines.length; i++) {
      L = lines[i];
      rows += '<tr class="nb"><td class="td">' + esc(L.code) + '</td><td class="td">' + esc(L.item) + '</td><td class="td">' + esc(L.product) + '</td><td class="td">' + br(L.spec) + '</td><td class="td r">' + esc(L.qty) + '</td><td class="td c n">' + esc(L.unit) + '</td><td class="td r">' + Number(L.price || 0).toFixed(2) + '</td><td class="td r">' + money(L.amount) + '</td><td class="td">' + br(L.note) + '</td></tr>';
    }
  }
  items += rows + '</table>';

  /* ---- 匯款 / 合計 / 條款 / 簽核 / 附件 ---- */
  var bank = br(q.bank);
  var low = '<div style="height:1mm"></div><table>';
  var sealImg = (q.signed && assets.seal) ? '<img src="' + assets.seal + '">' : '';
  var sealDate = q.signed ? d(q.agencyDate || q.date) : '';
  var att = '';
  if (q.attachments && q.attachments.length) { for (i = 0; i < q.attachments.length; i++) att += '<img src="' + q.attachments[i] + '">'; }

  if (M) {
    low += cg([32.4, 94, 24, 39.6]) +
      '<tr><td class="lb" style="font-weight:700">匯款資訊</td><td class="vl bk" style="border:.25mm solid #d6d6d6">' + bank + '</td><td class="lb">小計</td><td class="amt">' + money(q.subtotal) + '</td></tr>' +
      '<tr><td colspan="2"></td><td class="lb">營業稅</td><td class="amt">' + money(q.tax) + '</td></tr>' +
      '<tr><td colspan="2"></td><td class="gold">總金額(含稅)</td><td class="amt" style="font-size:9pt">' + money(q.total) + '</td></tr>' +
      '<tr><td colspan="4" style="height:5mm"></td></tr>';
    for (i = 0; i < terms.length; i++) {
      low += '<tr class="nb"><td class="lb">' + esc(terms[i].title) + '</td><td class="tm" colspan="3">' + br(terms[i].body) + '</td></tr>';
    }
    low += '<tr class="nb"><td class="lb">Agency Approved by</td><td class="seal" style="background:#fff">' + sealImg + '</td><td class="lb">日期</td><td class="vl" style="border-bottom:.25mm solid #d6d6d6">' + sealDate + '</td></tr>' +
      '<tr class="nb"><td class="lb" style="height:9mm">Client Approved by</td><td class="vl"></td><td class="lb">日期</td><td class="vl"></td></tr>' +
      '<tr><td colspan="4" style="height:5mm"></td></tr>' +
      '<tr class="nb"><td class="lb" style="vertical-align:top">附件參考</td><td class="att" colspan="3">' + att + '</td></tr>';
  } else {
    low += cg([20.5, 88, 11, 25, 45.5]) +
      '<tr><td class="lb" style="font-weight:700">匯款資訊</td><td class="vl bk" style="border:.25mm solid #d6d6d6">' + bank + '</td><td class="gap"></td><td class="lb">小計</td><td class="amt">' + money(q.subtotal) + '</td></tr>';
    var n = Math.max(terms.length, 2);
    for (i = 0; i < n; i++) {
      var T = terms[i] || { title: '', body: '' };
      var right = '<td class="gap"></td><td class="gap" colspan="2"></td>';
      if (i === 0) right = '<td class="gap"></td><td class="lb">營業稅</td><td class="amt">' + money(q.tax) + '</td>';
      if (i === 1) right = '<td class="gap"></td><td class="gold">總金額(含稅)</td><td class="amt" style="font-size:9pt">' + money(q.total) + '</td>';
      low += '<tr class="nb"><td class="lb">' + esc(T.title) + '</td><td class="tm">' + br(T.body) + '</td>' + right + '</tr>';
    }
    low += '<tr class="nb"><td class="lb">Agency Approved by</td><td class="seal" style="background:#fff">' + sealImg + '</td><td class="gap"></td><td class="lb">日期</td><td class="vl" style="border-bottom:.25mm solid #d6d6d6">' + sealDate + '</td></tr>' +
      '<tr class="nb"><td class="lb" style="height:9mm">Client Approved by</td><td class="vl"></td><td class="gap"></td><td class="lb">日期</td><td class="vl"></td></tr>' +
      '<tr><td colspan="5" style="height:5mm"></td></tr>' +
      '<tr class="nb"><td class="lb" style="vertical-align:top">相關附件</td><td class="att" colspan="4">' + att + '</td></tr>';
  }
  low += '</table>';

  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(q.no) + '</title><style>' + css + '</style></head><body><div class="pg">' + head + hd + items + low + '</div></body></html>';
}



/* ============ 小工具 ============ */
var S = { users: [], token: '', user: null, assets: {}, settings: { bank: '', rate: .05 }, customers: [], items: [], terms: [], quotes: [], kinds: [], view: 'quotes', filter: '全部', q: '' };
var E = null; // 目前編輯中的報價單
var RENDERING = 0; // 重新繪製期間忽略 blur 連帶觸發的 change/input 事件
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function $(s, r) { return (r || document).querySelector(s); }
function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function rnd(x) { return Math.round(Number(Number(x).toFixed(6))); }

/* ============ API（正式：GAS；示範：記憶體） ============ */
function api(act, data) {
  if (DEMO) return Promise.resolve(demoApi(act, data || {}));
  var body = JSON.stringify(Object.assign({ act: act, token: S.token }, data || {}));
  return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.code === 'AUTH') { localStorage.removeItem('cn_token'); S.token = ''; render(); } return j; })
    .catch(function () { return { ok: false, msg: '連線失敗，請檢查網路' }; });
}

/* ============ 計算（預覽用；存檔時以後台計算為準） ============ */
function calc(q) { var sub = 0; (q.lines || []).forEach(function (l) { l.amount = rnd((Number(l.qty) || 0) * (Number(l.price) || 0)); sub += l.amount; }); q.subtotal = sub; q.tax = rnd(sub * (S.settings.rate || .05)); q.total = sub + q.tax; return q; }

/* ============ 啟動 / 登入 ============ */
function start() {
  S.token = localStorage.getItem('cn_token') || '';
  if (DEMO) { S.token = 'demo'; }
  if (!S.token) return render();
  boot();
}
function boot() {
  api('boot').then(function (r) {
    if (!r || !r.ok) { if (r && r.code !== 'AUTH') toast(esc((r && r.msg) || '載入失敗')); return render(); }
    S.user = r.user; S.assets = r.assets || {}; S.settings = r.settings; S.customers = r.customers; S.items = r.items; S.terms = r.terms; S.quotes = r.quotes; S.kinds = r.kinds;
    render();
  });
}
function doLogin() {
  var email = $('#lg_email').value, code = $('#lg_code').value;
  var btn = $('#lg_btn'); btn.disabled = true; btn.textContent = '登入中…';
  api('login', { email: email, code: code, device: navigator.userAgent.slice(0, 80) }).then(function (r) {
    if (!r.ok) { btn.disabled = false; btn.textContent = '登入'; return toast(esc(r.msg || '登入失敗')); }
    S.token = r.token; localStorage.setItem('cn_token', r.token); boot();
  });
}
